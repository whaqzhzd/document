<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PPT Slideshow</title>
  <script src="web-apps/apps/api/documents/api.js"></script>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
    }

    #iframe {
      width: 100%;
      height: 100%;
      opacity: 0;
      pointer-events: none;
    }

    #iframe.ready {
      opacity: 1;
      pointer-events: auto;
    }

    #status {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      z-index: 10;
    }

    #status.hidden {
      display: none;
    }

    .status-card {
      max-width: 720px;
      text-align: center;
      padding: 24px;
      line-height: 1.7;
    }

    .status-title {
      margin: 0 0 12px;
      font-size: 24px;
      font-weight: 700;
    }

    .status-message {
      margin: 0;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.72);
    }

    #status.error .status-title {
      color: #fca5a5;
    }

    #status.error .status-message {
      color: rgba(252, 165, 165, 0.88);
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="iframe"></div>
    <div id="status">
      <div class="status-card">
        <h1 class="status-title">加载中...</h1>
        <p class="status-message">正在准备 PPT 放映环境...</p>
      </div>
    </div>
  </div>
</body>
<script type="module" src="./ppt-slideshow.ts"></script>

</html>
