[package]
name = "document-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.4"
fs2 = "0.4.3"
mime_guess = "2.0.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.47.1", features = ["fs", "macros", "net", "rt-multi-thread"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
